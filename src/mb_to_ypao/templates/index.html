{% extends "base.html" %}

{% block content %}
    <h1>Yamaha AVR PEQ Updater</h1>
    <form action="{{ url_for('index') }}" method="post" enctype="multipart/form-data">
        <label for="ip">Yamaha AVR IP:</label>
        <input type="text" name="ip" placeholder="Enter your Yamaha AVR IP here (e.g. 192.168.1.10:80)"><br><br>
        <button id="reset" onclick="submitForm('reset')">Reset</button><br><br>
        <label for="input">MB filters txt file:</label>
        <input type="file" name="file"><br><br>
        <button id="submit" onclick="submitForm('submit')">Submit</button>    
    </form>
    <div id="status_response">
        <h3>STATUS</h3>
        <pre>{{ response|safe }}</pre>
    </div>    
    <div id="mb_file">
        <h3>INPUT</h3>
        <pre>{{ mb_data|safe }}</pre>
    </div>
    <div id="avr_file">
        <h3>OUTPUT</h3>
        <a>{{ avr_data|safe}}</a>
    </div>

{% endblock %}
